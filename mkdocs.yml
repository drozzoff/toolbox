site_name: xsuite-toolbox
site_url: https://drozzoff.github.io/toolbox/

theme:
  name: material
  features:
    - content.code.copy

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            docstring_style: numpy
            docstring_section_style: spacy
            allow_inspection: true

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.highlight
  - pymdownx.superfences

nav:
  - Home: index.md
  - Guides:
    - Multi-GPU tracking: guides/multi_gpu.md
    - Separatrix search: guides/separatrix_search.md
    - Separatrix matching: guides/separatrix_matching.md
  - API References:
    - Multi-GPU: reference/multi_gpu.md
    - Separatrix: reference/separatrix.md
