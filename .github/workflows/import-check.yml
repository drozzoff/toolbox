name: toolbox import check

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  import-check:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
          python -m pip check

      - name: Import
        working-directory: ${{ runner.temp }}
        run: |
          python - <<'PY'
          import importlib
          import pkgutil

          import toolbox

          module_names = [
              module.name
              for module in pkgutil.walk_packages(
                  toolbox.__path__, prefix=f"{toolbox.__name__}."
              )
          ]

          for module_name in module_names:
              importlib.import_module(module_name)
              print(f"Imported {module_name}")

          print(f"Successfully imported toolbox and {len(module_names)} submodules")
          PY
