name: toolbox import check

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  import-check:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
          python -m pip check

      - name: Import check for core modules
        working-directory: ${{ runner.temp }}
        run: |
          python "${{ github.workspace }}/scripts/import_check.py"
